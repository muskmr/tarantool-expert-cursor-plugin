<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tarantool IS expert">
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Corner brackets -->
  <polygon points="0,0 96,0 0,96" fill="#0A0A0A"/>
  <polygon points="512,0 416,0 512,96" fill="#0A0A0A"/>
  <polygon points="0,512 0,416 96,512" fill="#0A0A0A"/>
  <polygon points="512,512 416,512 512,416" fill="#0A0A0A"/>

  <!-- Hexagon (pointy-top / vertically oriented) -->
  <defs>
    <clipPath id="hexClip">
      <polygon points="256,36 448,146 448,366 256,476 64,366 64,146"/>
    </clipPath>
    <pattern id="scanlines" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="6" fill="#0F3D2E"/>
      <rect y="0" width="4" height="2" fill="#0A2A1F"/>
      <rect y="3" width="4" height="1" fill="#145C45" opacity="0.55"/>
    </pattern>
    <linearGradient id="hexShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A5C45"/>
      <stop offset="45%" stop-color="#0F3D2E"/>
      <stop offset="100%" stop-color="#0A2A1F"/>
    </linearGradient>
    <filter id="softNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.25  0 0 0 0 0.18  0 0 0 0.25 0" result="tinted"/>
      <feBlend in="SourceGraphic" in2="tinted" mode="overlay"/>
    </filter>
  </defs>

  <polygon points="256,36 448,146 448,366 256,476 64,366 64,146"
           fill="url(#hexShade)" stroke="#0A0A0A" stroke-width="10" stroke-linejoin="round"/>

  <g clip-path="url(#hexClip)" filter="url(#softNoise)">
    <rect x="64" y="36" width="384" height="440" fill="url(#scanlines)"/>
    <!-- glitch streaks -->
    <rect x="80" y="120" width="280" height="3" fill="#1F7A5A" opacity="0.35"/>
    <rect x="140" y="210" width="220" height="2" fill="#2A9B74" opacity="0.28"/>
    <rect x="100" y="300" width="300" height="4" fill="#145C45" opacity="0.4"/>
    <rect x="160" y="360" width="180" height="2" fill="#2A9B74" opacity="0.25"/>
  </g>

  <!-- Hexagon outline on top -->
  <polygon points="256,36 448,146 448,366 256,476 64,366 64,146"
           fill="none" stroke="#0A0A0A" stroke-width="10" stroke-linejoin="round"/>

  <!-- Typography -->
  <text x="256" y="190" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600"
        letter-spacing="6">TARANTOOL</text>
  <text x="256" y="285" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="800"
        letter-spacing="4">IS</text>
  <text x="256" y="355" text-anchor="middle" fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="500"
        letter-spacing="2">expert</text>
</svg>
